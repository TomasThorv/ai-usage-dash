services:
  ai-usage-dash:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/tomasthorv/ai-usage-dash:local
    container_name: ai-usage-dash
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_PATH: /data/app.db
      MASTER_KEY: ${MASTER_KEY}
    volumes:
      - ai-usage-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  ai-usage-data:
